    <title>ChatMe</title>
    <!-- SPA route restore on direct URL visit or refresh -->
    <script type="text/javascript">
      (function(l) {
        if (!l.search) return;
        var query = l.search.slice(1);
        var parts = query.split('&');
        var pPart = parts.find(function(p) { return p.indexOf('p=/') === 0; });
        var qPart = parts.find(function(p) { return p.indexOf('q=') === 0; });
        if (pPart) {
          var path = pPart.slice(2);
          var search = qPart ? '?' + qPart.slice(2).replace(/~and~/g, '&') : '';
          window.history.replaceState(null, null, path + search + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
